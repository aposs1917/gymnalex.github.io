name: Publish Quarto Website

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Find R
        run: |
          echo "R is at:"
          which R
          echo "Rscript is at:"
          which Rscript
          R --version
          echo "QUARTO_R=$(dirname "$(which Rscript)")" >> "$GITHUB_ENV"

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("rmarkdown", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("knitr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("tidyverse", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("ggpubr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("readxl", repos="https://cloud.r-project.org")'

      - name: Check R packages
        run: |
          Rscript -e 'library(rmarkdown); cat("rmarkdown OK\n")'
          Rscript -e 'library(knitr); cat("knitr OK\n")'
          Rscript -e 'library(tidyverse); cat("tidyverse OK\n")'
          Rscript -e 'library(ggpubr); cat("ggpubr OK\n")'
          Rscript -e 'library(readxl); cat("readxl OK\n")'

      - name: Render website
        run: quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4