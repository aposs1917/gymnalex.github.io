name: Publish Quarto Website

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check R
        run: |
          echo "R_HOME=$R_HOME"
          echo "PATH=$PATH"
          which R
          which Rscript
          R --version
          Rscript --version

      - name: Render website
        run: quarto render
        env:
          QUARTO_R: ${{ env.R_HOME }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4